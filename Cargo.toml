[package]
name = "vardict_rs"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "vardict"
path = "src/bin/vardict.rs"

[dependencies]
anyhow = "1.0.102"
bio-types = "1.0.4"
clap = { version = "4.6", features = ["derive"] }
crackle-kit = { git = "https://github.com/Crispy13/crackle-kit", features = [
    "tracing",
] }
indexmap = "2.13.0"
libc = "0.2"
regex = "1.12.3"
rand = "0.10.0"
rust-htslib = { git = "https://github.com/Crispy13/rust-htslib.git", tag = "v1.0.0c3", features = [
    "libdeflate",
] }
smallvec = "1.15.1"
rayon = "1.11.0"
crossbeam-channel = "0.5"
statrs = "0.18"
rustc-hash = { version = "2.1", default-features = false }
mimalloc = { version = "0.1.48", optional = true }
tikv-jemallocator = { version = "0.6", optional = true }
dhat = { version = "0.3", optional = true }
bio = "3.0.0"
# needletail = {version="0.6.3", optional = true}
# bio = {version="3.0.0", optional = true}

[features]
default = ["mimalloc-global"]
mimalloc-global = ["dep:mimalloc"]
jemalloc-global = ["dep:tikv-jemallocator"]
dhat-heap = ["dep:dhat"]
# bio=["dep:bio"]
# needletail=["dep:needletail"]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "cigar_parser_bench"
harness = false

[[bench]]
name = "pipeline_bench"
harness = false

[profile.dev]
incremental = true

[profile.release]
lto = 'thin'
debug = "line-tables-only"

[profile.debug-release]
inherits = "release"
debug = true

[profile.deploy]
inherits = "release"
lto = true
codegen-units = 1
debug = false
